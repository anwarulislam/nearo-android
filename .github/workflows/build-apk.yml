name: Build and Release Nearo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Nearo APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PpersonalVersionCode="$GITHUB_RUN_NUMBER"

      - name: Sign and verify APK
        env:
          SIGNING_STORE: ${{ secrets.NEARO_APK_SIGNING_STORE || secrets.PERSONAL_APK_SIGNING_STORE }}
          SIGNING_PASSWORD: ${{ secrets.NEARO_APK_SIGNING_PASSWORD || secrets.PERSONAL_APK_SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.NEARO_APK_SIGNING_ALIAS || secrets.PERSONAL_APK_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          unsigned=(build/outputs/apk/release/*-unsigned.apk)
          [[ ${#unsigned[@]} == 1 && -f ${unsigned[0]} ]]

          if [[ -n "${SIGNING_STORE:-}" ]]; then
            echo "Signing with release keystore..."
            keystore="$RUNNER_TEMP/release.p12"
            trap 'rm -f "$keystore"' EXIT
            printf '%s' "$SIGNING_STORE" | base64 --decode > "$keystore"
            unset SIGNING_STORE
            key_alias="${SIGNING_ALIAS:-personal}"
            "$signer" sign --ks "$keystore" --ks-key-alias "$key_alias" \
              --ks-pass env:SIGNING_PASSWORD --out Nearo.apk "${unsigned[0]}"
          elif [[ -f "debug.keystore" ]]; then
            echo "No signing secret found; signing with debug keystore..."
            "$signer" sign --ks debug.keystore --ks-key-alias androiddebugkey \
              --ks-pass pass:android --out Nearo.apk "${unsigned[0]}"
          else
            echo "No keystore found; copying unsigned APK..."
            cp "${unsigned[0]}" Nearo.apk
          fi

          "$signer" verify --verbose --print-certs Nearo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nearo-APK
          path: Nearo.apk

      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Nearo.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Nearo · Build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" \
            --notes "Nearo Android APK built from commit $GITHUB_SHA."
